<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#f3e2d6"/>
  <text x="40" y="70" font-size="38" font-family="Malgun Gothic, sans-serif" fill="#2b1d1a">초은재의 웹 연습장</text>
  <rect x="40" y="110" width="720" height="90" rx="8" fill="#f5f5f5" stroke="#d9d9d9"/>
  <text x="70" y="160" font-size="24" font-family="Malgun Gothic, sans-serif" fill="#2b1d1a">안녕하세요, 조윤재님! 좋은 하루입니다.</text>
  <rect x="40" y="220" width="160" height="50" rx="6" fill="#ffffff" stroke="#cfcfcf"/>
  <text x="70" y="254" font-size="22" font-family="Malgun Gothic, sans-serif" fill="#2b1d1a">인사 바꾸기</text>
  <rect x="220" y="220" width="140" height="50" rx="6" fill="#ffffff" stroke="#cfcfcf"/>
  <text x="260" y="254" font-size="22" font-family="Malgun Gothic, sans-serif" fill="#2b1d1a">다크 모드</text>
  <rect x="40" y="290" width="720" height="120" rx="8" fill="#f5f5f5" stroke="#d9d9d9"/>
  <text x="70" y="335" font-size="22" font-family="Malgun Gothic, sans-serif" fill="#2b1d1a">소개</text>
  <text x="70" y="370" font-size="20" font-family="Malgun Gothic, sans-serif" fill="#2b1d1a">웹프로그래밍을 배우는 조윤재입니다.</text>
  <text x="70" y="400" font-size="20" font-family="Malgun Gothic, sans-serif" fill="#2b1d1a">이 페이지는 자바스크립트와 CSS를 활용한 연습장입니다.</text>
</svg>
